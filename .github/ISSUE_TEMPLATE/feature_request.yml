name: Feature request
description: Propose a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Keep it to what the user sees.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it is done
      description: Acceptance criteria as a checklist.
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked roadmap.md and this fits the current phase, or I am asking for sign-off.
