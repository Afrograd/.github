name: Bug report
description: Something is broken or behaves wrongly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? Paste error messages as text, not screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and device, desktop app, or environment (local, preview, production).
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
